name: Kaff
options:
  bundleIdPrefix: fr.nikou
  deploymentTarget:
    watchOS: "26.0"
  xcodeVersion: "26.6"
  # Langue de développement du projet = langue source du catalogue Localizable.xcstrings (M5.1).
  developmentLanguage: fr
  createIntermediateGroups: true
  generateEmptyDirectories: true

configFiles:
  Debug: Config/Local.xcconfig
  Release: Config/Local.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CURRENT_PROJECT_VERSION: 3
    MARKETING_VERSION: 0.1.0
    # Extraction des chaînes SwiftUI vers Localizable.xcstrings (M5.1).
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  KaffCore:
    path: Packages/KaffCore

targets:
  Kaff Watch App:
    type: application
    platform: watchOS
    sources:
      - path: Kaff Watch App
        excludes: ["**/*.entitlements"]
      # Jetons, anneau, libellés de statut, formats : compilés dans l'app ET la complication (pas de framework).
      - path: KaffUI
      # Vues des familles de complication, pour la galerie de debug `KAFF_WIDGET_GALLERY` (WidgetGalleryView).
      - path: KaffComplication/Views
    dependencies:
      - package: KaffCore
      - target: KaffComplication
        embed: true
    entitlements:
      path: Kaff Watch App/Kaff.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups: [group.fr.nikou.kaff]
    info:
      path: Kaff Watch App/Info.plist
      properties:
        CFBundleDevelopmentRegion: fr
        CFBundleDisplayName: Kaff
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKWatchOnly: true   # pas de WKRunsIndependentlyOfCompanionApp : App Store Connect refuse les deux ensemble (90751)
        NSHealthShareUsageDescription: Kaff lit vos doses de caféine et votre poids pour estimer votre niveau.
        NSHealthUpdateUsageDescription: Kaff enregistre les doses de caféine que vous loguez.
        # TestFlight / App Store : aucun chiffrement propriétaire, évite la question d'export à chaque build.
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: fr.nikou.kaff
            CFBundleURLSchemes: [kaff]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.nikou.kaff.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Release:
          # Les vues de complication ne servent qu'à la galerie de debug (`WidgetGalleryView`, DEBUG).
          EXCLUDED_SOURCE_FILE_NAMES: ["KaffComplication/Views/*.swift"]

  # Conteneur iOS sans code : Xcode n'a pas de méthode de distribution App Store pour watchOS (bug/limite
  # Xcode 26, forums Apple 817223 et 738218). App Store Connect voit une app iOS `fr.nikou.kaff` qui embarque
  # l'app Watch dans Watch/. Archiver le schéma `Kaff` pour TestFlight ; le schéma `Kaff Watch App` reste
  # celui du développement sur simulateur et montre.
  Kaff:
    type: application.watchapp2-container
    platform: iOS
    deploymentTarget: "18.0"
    dependencies:
      - target: Kaff Watch App
    info:
      path: KaffContainer/Info.plist
      properties:
        CFBundleDevelopmentRegion: fr
        CFBundleDisplayName: Kaff
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        ITSWatchOnlyContainer: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.nikou.kaff
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: "NO"

  KaffComplication:
    type: app-extension
    platform: watchOS
    sources:
      - path: KaffComplication
        excludes: ["**/*.entitlements"]
      - path: KaffUI
    dependencies:
      - package: KaffCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: KaffComplication/KaffComplication.entitlements
      properties:
        com.apple.security.application-groups: [group.fr.nikou.kaff]
    info:
      path: KaffComplication/Info.plist
      properties:
        CFBundleDevelopmentRegion: fr
        CFBundleDisplayName: Kaff
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.nikou.kaff.watchkitapp.widget

  KaffTests:
    type: bundle.unit-test
    platform: watchOS
    sources: [KaffTests]
    dependencies:
      - target: Kaff Watch App
      - package: KaffCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.nikou.kaff.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Kaff:
    build:
      targets:
        Kaff: all
    run:
      config: Debug
    archive:
      config: Release
  Kaff Watch App:
    build:
      targets:
        Kaff Watch App: all
        KaffComplication: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets: [Kaff Watch App, KaffComplication]
      targets: [KaffTests]
